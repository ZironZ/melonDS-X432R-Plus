name: Windows

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
      - x432r-plus
      - ci/*
      - release/*
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - main
      - x432r-plus

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MELONDS_GIT_BRANCH: ${{ github.ref }}
  MELONDS_GIT_HASH: ${{ github.sha }}
  MELONDS_BUILD_PROVIDER: GitHub Actions
#  MELONDS_VERSION_SUFFIX: " RC"

jobs:
  build:
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arch:
          - name: x86_64
            image: windows-2025-vs2026
          - name: arm64
            image: windows-11-arm

    name: ${{ matrix.arch.name }}
    runs-on: ${{ matrix.arch.image }}
    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg_cache,readwrite
    steps:
    - name: Check out sources
      uses: actions/checkout@v6
    - name: Restore vcpkg cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ github.workspace }}/vcpkg_cache
        key: vcpkg-${{ matrix.arch.name }}-windows-${{ hashFiles('vcpkg.json') }}
        restore-keys: vcpkg-${{ matrix.arch.name }}-windows-
    - name: Set up vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgJsonGlob: vcpkg.json
    - name: Build
      uses: lukka/run-cmake@v10
      with:
        configurePreset: release-windows-${{ matrix.arch.name }}
        configurePresetAdditionalArgs: "['-DENABLE_DEBUG_DEPS=OFF', '-DMELONDS_EMBED_BUILD_INFO=ON', '-DBUILD_POLICY_TESTS=ON', '-DBUILD_DEBUG_EXPORT_TESTS=ON', '-DBUILD_RENDERER_SHADER_TESTS=OFF']"
        buildPreset: release-windows-${{ matrix.arch.name }}
    - name: Test policies and debug exports
      run: ctest --test-dir build/release-windows-${{ matrix.arch.name }} --output-on-failure --no-tests=error --timeout 300 --output-junit test-results.xml
    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-results-windows-${{ matrix.arch.name }}
        path: |
          build/release-windows-${{ matrix.arch.name }}/test-results.xml
          build/release-windows-${{ matrix.arch.name }}/Testing/Temporary/*.log
        retention-days: 14
    - name: Package executable
      shell: pwsh
      run: |
        $releaseExe = 'build/release-windows-${{ matrix.arch.name }}/melonDS.exe'
        $releaseZip = 'melonDS-windows-${{ matrix.arch.name }}.zip'
        Compress-Archive -LiteralPath $releaseExe, 'README.md', 'LICENSE' -DestinationPath $releaseZip -Force
        $releaseHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $releaseZip).Hash.ToLowerInvariant()
        "$releaseHash  $releaseZip" | Set-Content -Encoding ascii 'SHA256SUMS-windows-${{ matrix.arch.name }}.txt'
    - uses: actions/upload-artifact@v7
      with:
        name: melonDS-windows-${{ matrix.arch.name }}
        path: melonDS-windows-${{ matrix.arch.name }}.zip
        archive: false
        if-no-files-found: error
        retention-days: 14
    - uses: actions/upload-artifact@v7
      with:
        path: SHA256SUMS-windows-${{ matrix.arch.name }}.txt
        archive: false
        if-no-files-found: error
        retention-days: 14
    - name: Save vcpkg cache
      uses: actions/cache/save@v4
      with:
        path: ${{ github.workspace }}/vcpkg_cache
        key: vcpkg-${{ matrix.arch.name }}-windows-${{ hashFiles('vcpkg.json') }}
