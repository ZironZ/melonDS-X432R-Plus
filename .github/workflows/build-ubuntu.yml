name: Ubuntu

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
      - x432r-plus
      - ci/*
      - release/*
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - main
      - x432r-plus

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MELONDS_GIT_BRANCH: ${{ github.ref }}
  MELONDS_GIT_HASH: ${{ github.sha }}
  MELONDS_BUILD_PROVIDER: GitHub Actions
#  MELONDS_VERSION_SUFFIX: " RC"

jobs:
  build:
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arch:
          - runner: ubuntu-22.04
            name: x86_64
          - runner: ubuntu-22.04-arm
            name: aarch64

    name: ${{ matrix.arch.name }}
    runs-on: ${{ matrix.arch.runner }}

    steps:
    - uses: actions/checkout@v6
      name: Check out sources
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install --allow-downgrades cmake ninja-build extra-cmake-modules libpcap0.8-dev libsdl2-dev libenet-dev \
          qt6-{base,base-private,multimedia}-dev qt6-wayland libqt6svg6-dev libarchive-dev libzstd-dev libfuse2 libfaad-dev \
          xvfb xauth mesa-utils libgl1-mesa-dri
    - name: Configure
      run: >
        cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
        -DCMAKE_INSTALL_PREFIX=/usr -DMELONDS_EMBED_BUILD_INFO=ON
        -DBUILD_POLICY_TESTS=ON -DBUILD_DEBUG_EXPORT_TESTS=ON
        -DBUILD_RENDERER_SHADER_TESTS=ON
    - name: Build
      run: |
        cmake --build build
        DESTDIR=AppDir cmake --install build
    - name: Test with Mesa software OpenGL
      env:
        LIBGL_ALWAYS_SOFTWARE: '1'
        QT_QPA_PLATFORM: xcb
      run: |
        xvfb-run -a glxinfo -B
        xvfb-run -a ctest --test-dir build --output-on-failure --no-tests=error --timeout 1200 --output-junit test-results.xml
    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-results-ubuntu-${{ matrix.arch.name }}
        path: |
          build/test-results.xml
          build/Testing/Temporary/*.log
        retention-days: 14
    - name: Package executable
      run: |
        mkdir -p package-ubuntu
        cp AppDir/usr/bin/melonDS README.md LICENSE package-ubuntu/
        (cd package-ubuntu && cmake -E tar cf ../melonDS-ubuntu-${{ matrix.arch.name }}.zip --format=zip melonDS README.md LICENSE)
        sha256sum melonDS-ubuntu-${{ matrix.arch.name }}.zip > SHA256SUMS-ubuntu-${{ matrix.arch.name }}.txt
    - uses: actions/upload-artifact@v7
      with:
        name: melonDS-ubuntu-${{ matrix.arch.name }}
        path: melonDS-ubuntu-${{ matrix.arch.name }}.zip
        archive: false
        if-no-files-found: error
        retention-days: 14
    - uses: actions/upload-artifact@v7
      with:
        path: SHA256SUMS-ubuntu-${{ matrix.arch.name }}.txt
        archive: false
        if-no-files-found: error
        retention-days: 14
    - name: Fetch AppImage tools
      run: |
        wget https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${{ matrix.arch.name }}.AppImage
        wget https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-${{ matrix.arch.name }}.AppImage
        chmod a+x linuxdeploy-*.AppImage
    - name: Build the AppImage
      env:
        EXTRA_PLATFORM_PLUGINS: libqwayland-egl.so;libqwayland-generic.so
        EXTRA_QT_PLUGINS: waylandcompositor
        QMAKE: /usr/lib/qt6/bin/qmake
      run: |
        ./linuxdeploy-${{ matrix.arch.name }}.AppImage --appdir AppDir --plugin qt --output appimage
    - name: Package AppImage
      run: |
        cmake -E tar cf melonDS-appimage-${{ matrix.arch.name }}.zip --format=zip melonDS*.AppImage README.md LICENSE
        sha256sum melonDS-appimage-${{ matrix.arch.name }}.zip > SHA256SUMS-linux-${{ matrix.arch.name }}.txt
    - uses: actions/upload-artifact@v7
      with:
        name: melonDS-appimage-${{ matrix.arch.name }}
        path: melonDS-appimage-${{ matrix.arch.name }}.zip
        archive: false
        if-no-files-found: error
        retention-days: 14
    - uses: actions/upload-artifact@v7
      with:
        path: SHA256SUMS-linux-${{ matrix.arch.name }}.txt
        archive: false
        if-no-files-found: error
        retention-days: 14
