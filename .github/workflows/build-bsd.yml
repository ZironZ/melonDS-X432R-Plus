name: BSD

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
      - x432r-plus
      - ci/*
      - release/*
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - main
      - x432r-plus

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MELONDS_GIT_BRANCH: ${{ github.ref }}
  MELONDS_GIT_HASH: ${{ github.sha }}
  MELONDS_BUILD_PROVIDER: GitHub Actions

jobs:
  build:
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [freebsd, netbsd, openbsd]
        # The emulated aarch64 VMs are quite slow, so disable aarch64
        # runs for now.
        arch: [x86_64] #, aarch64]
        include:
          - os: freebsd
            os_name: FreeBSD
            install_deps: >
              pkg install -y cmake kf6-extra-cmake-modules pkgconf ninja
              qt6-base qt6-multimedia qt6-svg sdl2 libarchive zstd enet
              faad2

          - os: netbsd
            os_name: NetBSD
            # The NetBSD VM image does not come with X sets by default,
            # so download and unpack the sets we need manually.
            # See https://github.com/vmactions/netbsd-vm/issues/2
            # Also, for some reason pkg_add is not in $PATH, so we have
            # to call it using its absolute location.
            prepare_vm: |
              /usr/sbin/pkg_add pkgin curl
              base=https://cdn.netbsd.org/pub/NetBSD
              mach=$(uname -m | sed "s/evbarm/evbarm-$(uname -p)/")
              rel=NetBSD-$(uname -r)
              for set in xbase xcomp; do
                curl -sL $base/$rel/$mach/binary/sets/$set.tar.xz |
                  tar xJpf - -C /
              done
            install_deps: >
              pkgin -y install cmake extra-cmake-modules pkgconf
              ninja-build qt6-qtbase qt6-qtmultimedia qt6-qtsvg SDL2
              libarchive zstd enet faad2

          - os: openbsd
            os_name: OpenBSD
            install_deps: >
              pkg_add -v cmake kf6-extra-cmake-modules pkgconf ninja
              qt6-qtbase qt6-qtmultimedia qt6-qtsvg sdl2 libarchive zstd
              enet faad


    name: ${{ matrix.os_name }} / ${{ matrix.arch }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: ${{ matrix.os }} {0}

    steps:
    - uses: actions/checkout@v6
      name: Check out sources

    - name: Start ${{ matrix.os_name }} VM
      uses: jenseng/dynamic-uses@v1
      with:
        uses: vmactions/${{ matrix.os }}-vm@v1
        # As we are using multiple steps, we need to use NFS to sync the
        # workspace between host and VM, as with the default, rsync, the
        # workspace is only synced before and after the setup VM step.
        with: >
          {
            "arch": "${{ matrix.arch }}",
            "envs": "MELONDS_GIT_BRANCH MELONDS_GIT_HASH
                     MELONDS_BUILD_PROVIDER",
            "prepare": ${{ toJSON(matrix.prepare_vm || '') }},
            "sync": "nfs",
            "usesh": "true"
          }

    - name: Install dependencies
      run: ${{ matrix.install_deps }}

    - name: Configure
      run: >
        cmake -S "$GITHUB_WORKSPACE" -B /tmp/build -G Ninja
        -DCMAKE_BUILD_TYPE=Release -DMELONDS_EMBED_BUILD_INFO=ON
        -DBUILD_POLICY_TESTS=ON -DBUILD_DEBUG_EXPORT_TESTS=OFF
        -DBUILD_RENDERER_SHADER_TESTS=OFF

    - name: Build
      run: |
        cmake --build /tmp/build
    - name: Test policies
      run: ctest --test-dir /tmp/build --output-on-failure --no-tests=error --timeout 300 --output-junit test-results.xml

    - name: Collect build and test output
      if: always()
      run: |
        if [ -d /tmp/build ]; then
          cp -RP /tmp/build "$GITHUB_WORKSPACE/"
        fi

    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-results-${{ matrix.os }}-${{ matrix.arch }}
        path: |
          build/test-results.xml
          build/Testing/Temporary/*.log
        retention-days: 14

    - name: Package executable
      run: |
        cp README.md LICENSE build/
        cd build
        cmake -E tar cf ../melonDS-${{ matrix.os }}-${{ matrix.arch }}.zip --format=zip melonDS README.md LICENSE
        cd ..
        cmake -E sha256sum melonDS-${{ matrix.os }}-${{ matrix.arch }}.zip > SHA256SUMS-${{ matrix.os }}-${{ matrix.arch }}.txt
    - name: Upload binary
      uses: actions/upload-artifact@v7
      with:
        name: melonDS-${{ matrix.os }}-${{ matrix.arch }}
        path: melonDS-${{ matrix.os }}-${{ matrix.arch }}.zip
        archive: false
        if-no-files-found: error
        retention-days: 14
    - uses: actions/upload-artifact@v7
      with:
        path: SHA256SUMS-${{ matrix.os }}-${{ matrix.arch }}.txt
        archive: false
        if-no-files-found: error
        retention-days: 14
